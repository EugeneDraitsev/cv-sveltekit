<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="48x48" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#121212" />
    <noscript
      ><style>
        /* Without scripts nothing will load: no progress to promise. */
        .galaxy-loader {
          display: none !important;
        }
      </style></noscript
    >
    %sveltekit.head%
    <script>
      if (typeof window.__chromium_devtools_metrics_reporter !== 'function') {
        window.__chromium_devtools_metrics_reporter = function () {};
      }

      // The site is dark only: drop the stored theme and monochrome choices.
      localStorage.removeItem('cv-theme');
      localStorage.removeItem('cv-grayscale');
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
