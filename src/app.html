<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="48x48" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <noscript
      ><style>
        /* Without scripts nothing will load: no progress to promise. */
        .galaxy-loader {
          display: none !important;
        }
      </style></noscript
    >
    %sveltekit.head%
    <script>
      if (typeof window.__chromium_devtools_metrics_reporter !== 'function') {
        window.__chromium_devtools_metrics_reporter = function () {};
      }

      const THEME_LOCAL_STORAGE_KEY = 'cv-theme';
      const THEME_ATTRIBUTE = 'data-theme';

      const savedTheme = localStorage.getItem(THEME_LOCAL_STORAGE_KEY);

      if (savedTheme) {
        document.documentElement.setAttribute(THEME_ATTRIBUTE, savedTheme);
      } else {
        const preferredScheme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';

        localStorage.setItem(THEME_LOCAL_STORAGE_KEY, preferredScheme);
        document.documentElement.setAttribute(THEME_ATTRIBUTE, preferredScheme);
      }

      // The monochrome mode is gone; drop its stored preference.
      localStorage.removeItem('cv-grayscale');
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
